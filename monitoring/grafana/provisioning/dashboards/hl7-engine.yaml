apiVersion: 1

providers:
  - name: "HL7 Engine Dashboards"
    orgId: 1
    folderUid: hl7-engine-folder
    folder: "HL7 Engine Boards"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /home/hovergames/grafana/conf/provisioning/dashboards/hl7-engine
      #path: /var/lib/grafana/dashboards/hl7-engine # path must match Docker volume mount. Typically, you mount like: ./grafana/hl7-engine:/var/lib/grafana/dashboards/hl7-engine