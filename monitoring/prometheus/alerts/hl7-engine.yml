groups:
  - name: hl7-engine-alerts
    interval: 30s
    rules:

    # ---------------------------------------------------------
    # 1. MLLP Subsystem Alerts
    # ---------------------------------------------------------

    - alert: HL7_MLLP_ConnectionErrors
      expr: increase(hl7_mllp_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "MLLP connection errors detected"
        description: "The HL7 MLLP listener is reporting connection or framing errors."

    - alert: HL7_MLLP_StalledInput
      expr: rate(hl7_messages_received_total[5m]) == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "No HL7 messages received"
        description: "The engine has not received any HL7 messages for 5 minutes."

    # ---------------------------------------------------------
    # 2. Parser Alerts
    # ---------------------------------------------------------

    - alert: HL7_Parser_Errors
      expr: increase(hl7_parser_parse_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "HL7 parser errors detected"
        description: "Messages are failing to parse. Check HL7 formatting or upstream systems."

    - alert: HL7_Parser_LatencyHigh
      expr: hl7_parser_latency_seconds_p95_seconds > 0.5
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "Parser latency elevated"
        description: "p95 parser latency is above 0.5 seconds."

    # ---------------------------------------------------------
    # 3. ACK Subsystem Alerts
    # ---------------------------------------------------------

    - alert: HL7_ACK_SuccessRateLow
      expr: (sum(rate(hl7_ack_generated_total{code="AA"}[5m])) / sum(rate(hl7_ack_generated_total[5m]))) < 0.95
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "ACK success rate below 95%"
        description: "Downstream systems may be rejecting messages or failing to respond."

    - alert: HL7_ACK_LatencyHigh
      expr: hl7_ack_rtt_seconds_p95_seconds > 0.05
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "ACK RTT latency above 50ms"
        description: "p95 ACK round-trip time exceeded 50ms for 3 minutes."

    - alert: HL7_ACK_LatencyCritical
      expr: hl7_ack_rtt_seconds_p95_seconds > 0.6
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "ACK RTT latency above 600ms"
        description: "p95 ACK round-trip time exceeded 600ms for 1 minutes."


    # ---------------------------------------------------------
    # 4. Router Alerts
    # ---------------------------------------------------------

    - alert: HL7_Router_Errors
      expr: increase(hl7_router_routing_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Routing errors detected"
        description: "Messages are failing to route to their destinations."

    - alert: HL7_Router_DestinationFailures
      expr: increase(hl7_router_destination_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Destination-specific routing failures"
        description: "One or more destinations are rejecting or failing to accept messages."

    # ---------------------------------------------------------
    # 5. Processing Alerts
    # ---------------------------------------------------------

    - alert: HL7_Processing_Errors
      expr: (increase(hl7_proc_stage_errors_total{stage='routing'}[5m]) + increase(hl7_proc_stage_errors_total{stage='file_write'}[5m]) + increase(hl7_proc_stage_errors_total{stage='db_insert'}[5m])) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Processing errors detected"
        description: "Internal processing stages are failing."

    - alert: HL7_Processing_QueueHigh
      expr: hl7_processing_queue_depth > 50
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Processing queue depth high"
        description: "Messages are backing up in the processing pipeline."

    # ---------------------------------------------------------
    # 6. Storage Alerts
    # ---------------------------------------------------------

    - alert: HL7_Storage_Errors
      expr: increase(hl7_store_write_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Storage write errors detected"
        description: "Messages are failing to persist to storage."

    - alert: HL7_Storage_LatencyHigh
      expr: hl7_store_write_latency_p95_seconds > 0.5
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "Storage write latency elevated"
        description: "Database writes are slower than expected."

    # ---------------------------------------------------------
    # 7. Exporter Alerts
    # ---------------------------------------------------------

    - alert: HL7_Exporter_Errors
      expr: increase(hl7_export_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Exporter errors detected"
        description: "Messages are failing to export to downstream systems."

    - alert: HL7_Exporter_RetriesHigh
      expr: increase(hl7_export_retries_total[5m]) > 5
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Exporter retries elevated"
        description: "Downstream systems may be unreachable or rejecting messages."


      # ---------------------------------------------------------
      # 8. Message Loss Alerts
      # ---------------------------------------------------------
    - alert: HL7_MessageLoss
      expr: increase(hl7_queue_overflow_total[5m]) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Message loss detected"
        description: "The processing queue overflowed and messages were dropped."

      # ---------------------------------------------------------
      # 9. Worker Saturation Alerts
      # ---------------------------------------------------------
    - alert: HL7_Worker_Saturation
      expr: (hl7_workers_busy / hl7_workers_max) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Worker saturation above 85%"
        description: "Workers are above 85% utilization."

      # ---------------------------------------------------------
      # 10. End-to-End Latency Alerts
      # ---------------------------------------------------------

    - alert: HL7_EndToEnd_LatencyHigh
      expr: hl7_message_end_to_end_latency_p95_seconds > 0.5
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "End-to-end latency above 500ms"
        description: "p95 end-to-end latency exceeded 500ms."
